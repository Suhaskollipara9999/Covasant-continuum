# Covasant Continuum — Docker Compose
# Development environment: PostgreSQL only

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: continuum_db
    environment:
      POSTGRES_DB: continuum_db
      POSTGRES_USER: continuum
      POSTGRES_PASSWORD: continuum_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuum"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
